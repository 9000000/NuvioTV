name: Build Android TV Release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Preview metadata, create a draft, or publish the release
        required: true
        type: choice
        options:
          - dry-run
          - draft
          - publish
        default: dry-run
      exclude_commits:
        description: Optional comma-separated commit hashes to omit from the notes
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: android-tv-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: ${{ inputs.mode }} Android TV release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
      LOCAL_DEV_PROPERTIES_BASE64: ${{ secrets.LOCAL_DEV_PROPERTIES_BASE64 }}
      RELEASE_KEYSTORE_BASE64: ${{ secrets.NUVIO_RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEY_ALIAS: ${{ secrets.NUVIO_RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.NUVIO_RELEASE_KEY_PASSWORD }}
      RELEASE_STORE_PASSWORD: ${{ secrets.NUVIO_RELEASE_STORE_PASSWORD }}

    steps:
      - name: Check out full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate release tooling
        run: |
          bash -n scripts/generate-release-notes.sh scripts/release-metadata.sh
          PYTHONPATH=scripts python3 -m unittest discover -s scripts/tests -v

      - name: Read release metadata
        id: release
        run: ./scripts/release-metadata.sh "${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Validate release state
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          RELEASE_COMMIT: ${{ steps.release.outputs.release_commit }}
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          if [[ "${RELEASE_REF_TYPE}" != "branch" ]]; then
            echo "Releases must be dispatched from a branch, not ${RELEASE_REF_TYPE}." >&2
            exit 1
          fi

          if [[ "${RELEASE_MODE}" == "publish" ]]; then
            if git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}"; then
              echo "Notice: Tag ${RELEASE_TAG} already exists on git."
            fi
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
              echo "Notice: A GitHub release for ${RELEASE_TAG} already exists."
            fi
          fi

          unexpected_changes="$(
            git diff --name-only "${CURRENT_BUMP}..${RELEASE_COMMIT}" \
              | grep -Ev '^(\.github/workflows/(android-release|beta-release)\.yml|scripts/release-metadata\.sh|scripts/generate-release-notes\.sh|scripts/generate_release_notes\.py|scripts/release_notes/.*|scripts/tests/.*)$' \
              || true
          )"
          if [[ -n "${unexpected_changes}" ]]; then
            echo "Notice: Additional files changed after the bump commit:"
            echo "${unexpected_changes}"
          fi

          if [[ "${RELEASE_MODE}" != "dry-run" ]]; then
            if [[ -z "${RELEASE_KEYSTORE_BASE64}" ]]; then
              echo "Notice: RELEASE_KEYSTORE_BASE64 secret not set. A self-signed release keystore will be generated."
            fi
            if [[ -z "${LOCAL_PROPERTIES_BASE64}" ]]; then
              echo "Notice: LOCAL_PROPERTIES_BASE64 secret not set. Default properties will be used."
            fi
          fi

      - name: Generate release notes
        env:
          PREVIOUS_BUMP: ${{ steps.release.outputs.previous_bump }}
          CURRENT_BUMP: ${{ steps.release.outputs.current_bump }}
          EXCLUDE_COMMITS: ${{ inputs.exclude_commits }}
          RELEASE_MODE: ${{ inputs.mode }}
        run: |
          release_note_args=(
            --from "${PREVIOUS_BUMP}"
            --to "${CURRENT_BUMP}"
            --repository "${GITHUB_REPOSITORY}"
            --exclude "${EXCLUDE_COMMITS}"
            --quality-report release-note-quality.md
          )

          generation_status=0
          ./scripts/generate-release-notes.sh "${release_note_args[@]}" \
            > release-notes.md || generation_status=$?

          if [[ ! -s release-notes.md ]]; then
            echo "No release-note commits were found, creating fallback notes."
            echo "Release ${{ steps.release.outputs.title }} (${{ steps.release.outputs.tag }})" > release-notes.md
          fi

          {
            echo "## ${{ steps.release.outputs.title }}"
            echo
            cat release-notes.md
            echo
            cat release-note-quality.md
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload release-note review
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-${{ inputs.mode }}-release-notes
          path: |
            release-notes.md
            release-note-quality.md
          if-no-files-found: warn
          retention-days: 14

      - name: Set up Java
        if: inputs.mode != 'dry-run'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: inputs.mode != 'dry-run'
        uses: gradle/actions/setup-gradle@v6

      - name: Configure release properties
        if: inputs.mode != 'dry-run'
        run: |
          keystore_path="${RUNNER_TEMP}/nuviotv-release.jks"
          key_alias="${RELEASE_KEY_ALIAS:-nuviotv}"
          key_password="${RELEASE_KEY_PASSWORD:-815787}"
          store_password="${RELEASE_STORE_PASSWORD:-815787}"

          if [[ -n "${RELEASE_KEYSTORE_BASE64}" ]]; then
            printf '%s' "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          else
            echo "Generating self-signed release keystore for CI build..."
            keytool -genkeypair \
              -v \
              -keystore "${keystore_path}" \
              -storepass "${store_password}" \
              -alias "${key_alias}" \
              -keypass "${key_password}" \
              -dname "CN=Nuvio Release,O=Nuvio,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000
          fi

          if [[ -n "${LOCAL_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_PROPERTIES_BASE64}" | base64 --decode > local.properties
          elif [[ ! -f local.properties ]]; then
            touch local.properties
          fi

          if [[ -n "${LOCAL_DEV_PROPERTIES_BASE64}" ]]; then
            printf '%s' "${LOCAL_DEV_PROPERTIES_BASE64}" | base64 --decode > local.dev.properties
          fi

          set_property() {
            local property_name="$1"
            local property_value="$2"
            [[ -n "${property_value}" ]] || return 0
            sed -i -E "/^[[:space:]]*${property_name}[[:space:]]*=/d" local.properties
            printf '\n%s=%s\n' "${property_name}" "${property_value}" >> local.properties
          }

          sed -i -E '/^[[:space:]]*(sdk\.dir|NUVIO_RELEASE_STORE_FILE)[[:space:]]*=/d' local.properties
          set_property NUVIO_RELEASE_STORE_FILE "${keystore_path}"
          set_property NUVIO_RELEASE_KEY_ALIAS "${key_alias}"
          set_property NUVIO_RELEASE_KEY_PASSWORD "${key_password}"
          set_property NUVIO_RELEASE_STORE_PASSWORD "${store_password}"

          if ! grep -Eq "^[[:space:]]*TRAKT_CLIENT_ID[[:space:]]*=" local.properties; then
            set_property TRAKT_CLIENT_ID "placeholder_trakt_client_id"
          fi
          if ! grep -Eq "^[[:space:]]*TRAKT_CLIENT_SECRET[[:space:]]*=" local.properties; then
            set_property TRAKT_CLIENT_SECRET "placeholder_trakt_client_secret"
          fi
          if ! grep -Eq "^[[:space:]]*SUPABASE_URL[[:space:]]*=" local.properties; then
            set_property SUPABASE_URL "https://api.nuvio.tv"
          fi
          if ! grep -Eq "^[[:space:]]*SUPABASE_ANON_KEY[[:space:]]*=" local.properties; then
            set_property SUPABASE_ANON_KEY "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzgxNTIxMzQ2LCJleHAiOjE5MzkyMDEzNDZ9.tmQaj682pwzehpqlgCDMnySOqiUvpgRbrE43T4VJpDI"
          fi
          if ! grep -Eq "^[[:space:]]*SUPABASE_FALLBACK_URL[[:space:]]*=" local.properties; then
            set_property SUPABASE_FALLBACK_URL "https://api-two.nuvioapp.space"
          fi
          if ! grep -Eq "^[[:space:]]*AVATAR_PUBLIC_BASE_URL[[:space:]]*=" local.properties; then
            set_property AVATAR_PUBLIC_BASE_URL "https://api.nuvio.tv/storage/v1/object/public/avatars"
          fi
          if ! grep -Eq "^[[:space:]]*TRAILER_API_URL[[:space:]]*=" local.properties; then
            set_property TRAILER_API_URL "https://trailer2.nuvioapp.space/"
          fi
          if ! grep -Eq "^[[:space:]]*TV_LOGIN_WEB_BASE_URL[[:space:]]*=" local.properties; then
            set_property TV_LOGIN_WEB_BASE_URL "https://nuvio.tv/tv-login"
          fi
          if ! grep -Eq "^[[:space:]]*DEVICE_LOGIN_WEB_BASE_URL[[:space:]]*=" local.properties; then
            set_property DEVICE_LOGIN_WEB_BASE_URL "https://nuvio.tv/link"
          fi
          if ! grep -Eq "^[[:space:]]*SUPPORTERS_API_BASE_URL[[:space:]]*=" local.properties; then
            set_property SUPPORTERS_API_BASE_URL "https://nuvio.tv/"
          fi
          if ! grep -Eq "^[[:space:]]*SUPPORT_URL[[:space:]]*=" local.properties; then
            set_property SUPPORT_URL "https://nuvio.tv/support"
          fi
          if ! grep -Eq "^[[:space:]]*PLAYBACK_REPORTS_BASE_URL[[:space:]]*=" local.properties; then
            set_property PLAYBACK_REPORTS_BASE_URL "https://nuvio.tv/"
          fi

      - name: Test updater and build full release APKs
        if: inputs.mode != 'dry-run'
        run: ./gradlew :app:testFullReleaseUnitTest --tests 'com.nuvio.tv.updater.*' :app:assembleFullRelease --stacktrace

      - name: Upload build artifacts
        if: inputs.mode != 'dry-run'
        uses: actions/upload-artifact@v6
        with:
          name: nuviotv-${{ steps.release.outputs.version }}-full-release
          path: app/build/outputs/apk/full/release/*.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: inputs.mode != 'dry-run'
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_TARGET: ${{ github.sha }}
          RELEASE_PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          mapfile -t release_apks < <(find app/build/outputs/apk/full/release -maxdepth 1 -type f -name '*.apk' -print | sort)
          if (( ${#release_apks[@]} == 0 )); then
            echo "No release APKs were produced." >&2
            exit 1
          fi

          release_args=(
            "${RELEASE_TAG}"
            --target "${RELEASE_TARGET}"
            --title "${RELEASE_TITLE}"
            --notes-file release-notes.md
          )
          if [[ "${RELEASE_PRERELEASE}" == "true" ]]; then
            release_args+=(--prerelease)
          elif [[ "${RELEASE_MODE}" == "publish" ]]; then
            release_args+=(--latest)
          fi
          if [[ "${RELEASE_MODE}" == "draft" ]]; then
            release_args+=(--draft)
          fi

          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "Release ${RELEASE_TAG} already exists. Updating release assets..."
            gh release upload "${RELEASE_TAG}" "${release_apks[@]}" --clobber
          else
            gh release create "${release_args[@]}" "${release_apks[@]}"
          fi
